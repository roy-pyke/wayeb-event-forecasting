name: Reproduce author deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            ~/.sbt/boot
            ~/.cache/coursier
            ~/.cache/pip
          key: ${{ runner.os }}-wayeb-${{ hashFiles('toolchain.json', 'build/**/*.sbt', 'configs/requirements-rtcef.lock.txt') }}
      - name: Build, test, forecast and exercise RTCEF services
        run: ./reproduce.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-validation
          if-no-files-found: warn
          retention-days: 14
          path: |
            runs/*/report.json
            runs/*/*.log
            runs/*/messages.json
            runs/*/config.json
            runs/*/rtcef.ini

