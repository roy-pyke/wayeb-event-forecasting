name: State forecasting research checks
on:
  push:
    branches: [main]
    paths: ['state_forecasting/**', 'build/build.sbt', '.github/workflows/state-forecasting.yml']
  pull_request:
    paths: ['state_forecasting/**', 'build/build.sbt', '.github/workflows/state-forecasting.yml']
  workflow_dispatch:
    inputs:
      real_data:
        description: 'Run the full frozen MetroPT evaluation (downloads 208 MiB)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  causal-and-reproduction:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .tools
            .cache/state_forecasting/metropt3.zip
            ~/.sbt/boot
            ~/.cache/coursier
            ~/.cache/pip
          key: ${{ runner.os }}-state-${{ hashFiles('state_forecasting/configs/requirements.lock.txt', 'build/**/*.sbt') }}
      - name: Set up Python
        run: |
          python -m venv .venv-state
          .venv-state/bin/python -m pip install --only-binary=:all: -r state_forecasting/configs/requirements.lock.txt
      - name: Causal, semantic and probability tests
        run: |
          ./state_forecasting/run.sh -m unittest discover -s state_forecasting/tests -v
          ./state_forecasting/run.sh state_forecasting/scripts/controls.py
      - name: Full real-data reproduction
        if: ${{ inputs.real_data == true }}
        run: ./state_forecasting/reproduce.sh runs/state-ci
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state-forecasting-evidence
          retention-days: 14
          path: |
            state_forecasting/reports/*.json
            runs/state-ci/*.json
            runs/state-ci/*.npz
            runs/state-recognition/*.log
